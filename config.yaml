# Plume Constraint configuration.
# Everything site- and constraint-specific lives here; the code stays generic.

site:
  lat: 28.5620
  lon: -80.5772
  height_ft: 200            # evaluation height above ground
  display_tz: America/New_York

# Wind constraint. A NO-GO requires magnitude AND direction to violate together;
# the combined level for each member is the lower of the two individual levels.
constraint:
  magnitude_mph:
    assess_at_or_above: 5.8   # below this = GO
    nogo_above: 8.4
  direction_deg:
    go_arc: [155, 60]         # clockwise from first to second, inclusive (wraps through north)
    nogo_arc: [80, 135]       # inclusive; anything outside go_arc and nogo_arc = assessment

window:
  hours_back: 12
  hours_ahead: 96

# Vertical adjustment to the evaluation height.
#  - Two model levels bracketing the height: u/v interpolated linearly in ln(z).
#  - One level only: power-law scaling with this exponent.
#  - Gust at height = mean wind at height + (10 m gust - 10 m mean wind).
vertical:
  power_law_alpha: 0.14

# Relative weight per source. At each hour a source's weight is split evenly
# across its members that have data at that hour, so a 51-member ensemble
# does not outvote a 6-member time-lagged hi-res ensemble by sheer count.
sources:
  - id: hrrr
    kind: hrrr
    label: HRRR time-lagged
    family: hires
    weight: 3
    lag_cycles: 6            # latest N hourly cycles (18 h reach)
    synoptic_extra: 2        # plus the latest N 00/06/12/18Z cycles (48 h reach)

  - id: rrfs
    kind: rrfs
    label: RRFS time-lagged
    family: hires
    weight: 3
    lag_cycles: 4
    synoptic_extra: 2
    bases:                   # tried in order; first one with data wins
      - https://nomads.ncep.noaa.gov/pub/data/nccf/com/rrfs/prod
      - https://nomads.ncep.noaa.gov/pub/data/nccf/com/rrfs/v1.0
      - https://nomads.ncep.noaa.gov/pub/data/nccf/com/rrfs/para
    file: "rrfs.{ymd}/{hh}/rrfs.t{hh}z.prslev.3km.f{fh:03d}.conus.grib2"

  - id: refs
    kind: ensprod
    label: REFS
    family: hires
    weight: 3
    pseudo_members: 20       # REFS publishes mean + spread, not members
    max_fh: 60
    bases:
      - https://nomads.ncep.noaa.gov/pub/data/nccf/com/refs/prod
      - https://nomads.ncep.noaa.gov/pub/data/nccf/com/refs/v1.0
      - https://nomads.ncep.noaa.gov/pub/data/nccf/com/refs/para
    files:
      mean: "refs.{ymd}/{hh}/ensprod/refs.t{hh}z.mean.f{fh:02d}.conus.grib2"
      sprd: "refs.{ymd}/{hh}/ensprod/refs.t{hh}z.sprd.f{fh:02d}.conus.grib2"

  - id: href
    kind: ensprod            # legacy; drops out on its own once NCEP retires it
    label: HREF
    family: hires
    weight: 2
    pseudo_members: 20
    max_fh: 48
    bases:
      - https://nomads.ncep.noaa.gov/pub/data/nccf/com/href/prod
    files:
      mean: "href.{ymd}/ensprod/href.t{hh}z.conus.mean.f{fh:02d}.grib2"
      sprd: "href.{ymd}/ensprod/href.t{hh}z.conus.sprd.f{fh:02d}.grib2"

  - id: nbm
    kind: openmeteo_det
    label: NBM
    family: blend
    weight: 2
    model: ncep_nbm_conus

  - id: ndfd
    kind: nws_grid
    label: NDFD
    family: blend
    weight: 1

  - id: meteoblue
    kind: meteoblue
    label: meteoblue
    family: blend
    weight: 1                # skipped unless METEOBLUE_API_KEY is set

  - id: ecmwf_ens
    kind: openmeteo_ens
    label: ECMWF ENS
    family: global
    weight: 2
    model: ecmwf_ifs025

  - id: aifs_ens
    kind: openmeteo_ens
    label: ECMWF AIFS ENS
    family: global
    weight: 1
    model: ecmwf_aifs025

  - id: gefs
    kind: openmeteo_ens
    label: GEFS
    family: global
    weight: 1
    model: gfs025

  - id: icon_eps
    kind: openmeteo_ens
    label: ICON EPS
    family: global
    weight: 1
    model: icon_seamless

  - id: gem_eps
    kind: openmeteo_ens
    label: GEM EPS
    family: global
    weight: 1
    model: gem_global
